name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Type check, build, tests (Node 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: bash scripts/uji.sh

  node20:
    name: Build and run on Node 20
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsc -p tsconfig.build.json
      - run: node dist/cli.js --version
      - run: node dist/cli.js --help

  readme-commands:
    # The same commands the README gives, from an empty folder, on a machine with no clone and no build step.
    name: README install and replay from an empty folder (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    # A clean Node container, the same place the commands were measured (docs/02-DECISIONS.md, decision 21).
    container: node:${{ matrix.node }}-alpine
    env:
      RUN_ID: 20261122-0453-53ba
    steps:
      - run: apk add --no-cache git
      - uses: actions/checkout@v4
        if: github.event_name != 'push'
      - name: Choose the package to install
        env:
          SPEC_PUSH: github:${{ github.repository }}#${{ github.sha }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            echo "SPEC=$SPEC_PUSH" >> "$GITHUB_ENV"
          else
            # A pull request's merge commit cannot be fetched by npm, so pack the checkout instead.
            npm pack --pack-destination "$RUNNER_TEMP"
            echo "SPEC=$(ls "$RUNNER_TEMP"/bumpproof-*.tgz)" >> "$GITHUB_ENV"
          fi
      - name: Install globally, then replay by id and by path
        shell: sh
        run: |
          set -eo pipefail
          cd "$(mktemp -d)"
          # Without --install-links npm links a global git install to a temporary clone it then deletes.
          npm install -g --install-links "$SPEC"
          bumpproof --version
          bumpproof replay "$RUN_ID" | tee by-id.txt
          grep -q '^Verdict: ' by-id.txt
          bumpproof replay "docs/runs/$RUN_ID" | tee by-path.txt
          grep -q '^Verdict: ' by-path.txt
          if bumpproof replay no-such-run; then echo "an unknown run must fail"; exit 1; fi
      - name: Every bumpproof command in the README exists
        shell: sh
        run: |
          set -eo pipefail
          # npm ships README.md in every package, so the installed copy is the one to read.
          readme="$(npm root -g)/bumpproof/README.md"
          cmds=$(awk '/^ *```/ { f = !f; next } f' "$readme" | sed -n 's/^ *bumpproof \([a-z][a-z-]*\).*/\1/p' | sort -u)
          test -n "$cmds"
          for c in $cmds; do
            bumpproof "$c" --help > /dev/null || { echo "the README names a command that does not exist: $c"; exit 1; }
          done
          if bumpproof no-such-command --help > /dev/null; then echo "an unknown command must fail"; exit 1; fi
      - name: init writes a config and draft journeys in an empty app
        shell: sh
        run: |
          set -eo pipefail
          cd "$(mktemp -d)"
          echo '{"scripts":{"build":"vite build"},"devDependencies":{"vite":"5.0.0"}}' > package.json
          echo '{}' > package-lock.json
          bumpproof init
          grep -q '"serve": "npx --no-install vite preview' .bumpproof/config.json
          test -f .bumpproof/journeys/home_test.md
          test -f .bumpproof/journeys/nav_test.md
          if bumpproof init; then echo "a second init must not replace the config"; exit 1; fi
      - name: npx replay from an empty folder
        shell: sh
        run: |
          set -eo pipefail
          cd "$(mktemp -d)"
          # On a push, the exact README line: npm 10 cannot npx a github: spec pinned to a commit ("GitFetcher requires an
          # Arborist constructor"). On a pull request, the packed checkout; npx reads a bare tarball path as a command.
          case "$SPEC" in
            github:*) npx -y "github:$GITHUB_REPOSITORY" replay "docs/runs/$RUN_ID" | tee npx.txt ;;
            *) npx -y --package="$SPEC" bumpproof replay "docs/runs/$RUN_ID" | tee npx.txt ;;
          esac
          grep -q '^Verdict: ' npx.txt
      - name: npm's debug log, when a step above failed
        if: failure()
        shell: sh
        run: |
          for f in "$HOME"/.npm/_logs/*.log; do grep -E 'verbose (stack|argv)|http fetch|error' "$f" | tail -40; done

  example-shop:
    name: Build the demo shop
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: examples/shop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: examples/shop/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  action:
    name: Run the Action on the demo shop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - id: bumpproof
        uses: ./
        with:
          dir: examples/shop
          base: ${{ github.sha }}
          head: ${{ github.sha }}
          comment: 'false'
      - name: Both sides built
        env:
          OUTCOME: ${{ steps.bumpproof.outputs.outcome }}
          COMMENT: ${{ steps.bumpproof.outputs.comment-file }}
        run: |
          test "$OUTCOME" = both_built
          grep -q '<!-- bumpproof-action -->' "$COMMENT"
